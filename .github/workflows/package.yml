name: Package

on:
  push:
    branches: [main]
  workflow_dispatch:

jobs:
  pack:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - run: npm test
      - run: npm pack
      - uses: actions/upload-artifact@v4
        with:
          name: tidy-strings-${{ github.sha }}
          path: "*.tgz"
          retention-days: 3
